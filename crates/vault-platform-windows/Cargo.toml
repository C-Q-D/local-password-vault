[package]
name = "vault-platform-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
vault-storage = { path = "../vault-storage" }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography_UI",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
zeroize = "1.9.0"

[dev-dependencies]
getrandom = "0.4.3"
