[package]
name = "vault-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1.0"
